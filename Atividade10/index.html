<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 10 - IMC</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <h2>Calculadora de IMC</h2>

    <form>
        <label for="altura">Informe sua altura:</label>
        <input type="number" id="altura" name="altura" step="0.01" placeholder="Ex.: 1.5m">

        <br><br>

        <label for="peso">Informe seu peso:</label>
        <input type="number" id="peso" name="peso" step="0.1" placeholder="Ex.: 60kg">

        <br><br>

        <button type="button" onclick="calcIMC()">Calcular</button>

        <p id="resultado"></p>
    </form>
    
</body>
</html>
