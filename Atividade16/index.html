<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Fatec Sorocaba - Cursos</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js"></script>
</head>
<body>

  <h1>Fatec Sorocaba</h1>
  <p>Selecione um curso para visualizar informações</p>

  <!-- quando o usuário mudar a opção já chama a função abrirCurso() -->
  <select id="selectCurso" onchange="abrirCurso(this)">
    <option value="">— Escolha um curso —</option>
    <option value="ads">Análise e Desenvolvimento de Sistemas</option>
    <option value="bd">Banco de Dados</option>
    <option value="gi">Gestão da Informação</option>
    <option value="gn">Gestão de Negócios</option>
    <option value="logistica">Logística</option>
    <option value="manutencao">Manutenção de Aeronaves</option>
    <option value="rh">Recursos Humanos</option>
    <option value="ti">Tecnologia em Redes de Computadores</option>
  </select>

</body>
</html>
