<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Pesquisa de opinião</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <form id="pesquisa" onsubmit="registrar(event)">
        <p id="progresso">Pessoa 1 de 45</p>

        <div id="campo-idade">
            <label for="idade">Idade</label>
            <input type="number" id="idade" required>
        </div>

        <div id="campo-sexo">
            <p>Sexo</p>
            <label><input type="radio" name="sexo" value="masculino" checked> Masculino</label>
            <label><input type="radio" name="sexo" value="feminino"> Feminino</label>
            <label><input type="radio" name="sexo" value="outros"> Outros</label>
        </div>

        <div id="campo-opiniao">
            <p>Opinião sobre o filme</p>
            <label><input type="radio" name="opiniao" value="4" required> Ótimo</label>
            <label><input type="radio" name="opiniao" value="3"> Bom</label>
            <label><input type="radio" name="opiniao" value="2"> Regular</label>
            <label><input type="radio" name="opiniao" value="1"> Péssimo</label>
        </div>

        <button type="submit">Registrar pessoa</button>
        <button type="button" onclick="verResultados()" id="btn-resultado" style="display:none">Ver resultados</button>

        <div id="resultado" style="display:none"></div>

    </form>

    <script src="script.js"></script>
</body>

</html>
