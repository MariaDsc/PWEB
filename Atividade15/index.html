<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 15</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <main>
        <form name="formulario" onsubmit="return validarDados()">
            <h2 id="titulo1">Formulário Principal</h2>

            <label for="nome">Nome:</label>
            <br>
            <input type="text" id="nome" name="nome" minlength="10" placeholder="Digite seu nome" required>
            <br><br>

            <label for="email">E-mail:</label>
            <br>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
            <br><br>

            <label for="comentario">Comentário:</label>
            <br>
            <textarea id="comentario" name="comentario" rows="5" cols="33" minlength="20" required></textarea>
            <br><br>

            <h3 id="titulo2">Pesquisa:</h3>
            <label for="pesquisa">Primeira vez nessa página?</label>
            <br>
            <input type="radio" id="pesquisa" name="opcoes" value="sim" checked>Sim
            <input type="radio" id="pesquisa" name="opcoes" value="nao">Não
            <br><br>

            <button type="submit" class="botao">Enviar</button>
            <button type="reset" class="botao">Limpar</button>
        </form>
    </main>
    
</body>
</html>
